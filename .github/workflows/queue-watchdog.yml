name: Queue watchdog

on:
  pull_request:
    paths:
      - 'scripts/maintenance/queue_watchdog/**'
      - '.github/workflows/queue-watchdog.yml'
  push:
    branches: ['codex/ov-stall-recovery-*']
    paths:
      - 'scripts/maintenance/queue_watchdog/**'
      - '.github/workflows/queue-watchdog.yml'

permissions:
  contents: read

jobs:
  isolated-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/maintenance/queue_watchdog -p 'test_*.py' -v
      - run: git diff --check
